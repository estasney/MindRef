repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-format

  - repo: local
    hooks:
      - id: cythonize
        name: regenerate .c from .pyx
        entry: uv run cython -3
        language: system
        types: [cython]
        files: \.pyx$
